<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09090b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="MAB Humidor"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><title>MAB Humidor</title><link rel="stylesheet" href="styles.css"></head><body><header><div><small>COLECAO PESSOAL</small><h1>MAB Humidor</h1></div><button id="settingsBtn" class="icon">⚙️</button></header><main><section id="metrics" class="metrics"></section><section id="best"></section><section class="filters"><input id="search" placeholder="Buscar por nome, marca, pais..."><select id="origin"><option value="">Todas origens</option></select><select id="strength"><option value="">Todas forcas</option><option>Leve</option><option>Media</option><option>Forte</option></select><select id="benefit"><option value="">Todo custo-beneficio</option><option>Bom</option><option>Ruim</option><option>Sem avaliacao</option></select><select id="sort"><option value="name">Nome</option><option value="rating">Maior nota</option><option value="quantity">Maior estoque</option><option value="priceAsc">Menor preco</option><option value="priceDesc">Maior preco</option></select></section><section id="list" class="list"></section></main><button id="addBtn" class="fab">＋ Novo charuto</button><dialog id="formDlg"><form id="form" method="dialog"><div class="modalHead"><div><small>CADASTRO</small><h2 id="formTitle">Novo charuto</h2></div><button type="button" class="close">✕</button></div><div class="grid"><label class="wide">Nome / marca<input name="name" required></label><label>Formato da vitola<input name="vitolaFormat" placeholder="Ex.: Robusto"></label><label>Comprimento (mm)<input name="length" type="number" inputmode="decimal"></label><label>Ring gauge<input name="ringGauge" type="number" inputmode="numeric"></label><label>Pais de origem<input name="origin"></label><label>Fabricante<input name="manufacturer"></label><label>Forca<select name="strength"><option>Leve</option><option selected>Media</option><option>Forte</option></select></label><label>Capa<input name="wrapper"></label><label>Capote<input name="binder"></label><label class="wide">Tripa<input name="filler"></label><label class="wide">Notas de sabor<textarea name="flavors" placeholder="Cedro, cafe, couro..."></textarea></label><label class="wide photo">Foto<input name="photoFile" type="file" accept="image/*" capture="environment"><img id="photoPreview" hidden></label><label>Data da compra<input name="purchaseDate" type="date"></label><label>Loja<input name="store"></label><label>Quantidade<input name="quantity" type="number" min="1" value="1" required></label><label>Valor unitario<input name="unitPrice" type="number" min="0" step="0.01" inputmode="decimal" required></label><div class="wide total">Valor total <b id="total">R$ 0,00</b></div><label>Nota <input name="rating" id="rating" type="number" min="0" step="0.5"></label><label>Comentarios<input name="comments"></label></div><button class="primary wideBtn" value="default">Salvar charuto</button></form></dialog><dialog id="detailDlg"><div id="detail"></div></dialog><dialog id="settingsDlg"><div class="modalHead"><h2>Configuracoes e backup</h2><button class="close" type="button">✕</button></div><label>Escala de avaliacao<select id="scoreScale"><option value="5">1 a 5</option><option value="100">0 a 100</option></select></label><label>Preco de referencia<input id="referencePrice" type="number"></label><label>Limite para Bom: <b id="thresholdLabel"></b><input id="threshold" type="range" min="0.5" max="0.9" step="0.01"></label><p class="hint">Regra: 75% da nota normalizada + 25% da relacao entre preco de referencia e preco pago.</p><div class="actions"><button id="exportBtn" class="primary">Exportar backup</button><button id="importBtn">Importar backup</button><input id="importFile" type="file" accept="application/json" hidden></div></dialog><script src="app.js"></script></body></html>
